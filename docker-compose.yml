# Local Postgres for development and tests: docker compose up -d db
services:
  db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nona
      POSTGRES_PASSWORD: nona
      POSTGRES_DB: nona
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
