<!doctype html>
<!-- Source of public/email/header.jpg (1200x860, shown at 600x430), the RSVP email's header.
     The pre-wedding shoot with "Sat 5 Dec" and 05·12 in glass numerals behind the couple, like a
     phone's lock screen (date-photo.jpg, from just above the date line down), so the first thing a
     guest sees is the day. Like the header before it, it fades into the email's blush page
     (#F7EFEA): softly at the sides, and from the couple's knees down at the bottom, so the letter
     starts where the picture ends. Render it with render.mjs. --><html><head><meta charset="utf-8"><style>
html, body { margin: 0; }
.header { width: 1200px; height: 860px; position: relative; overflow: hidden; background: #F7EFEA; }
.header img { display: block; width: 1200px; height: 860px; object-fit: cover; object-position: 50% 0%; }
.fade { position: absolute; inset: 0; background:
  linear-gradient(180deg, rgba(247,239,234,0) 0%, rgba(247,239,234,0) 60%, rgba(247,239,234,0.35) 71%, rgba(247,239,234,0.8) 85%, #F7EFEA 98%),
  linear-gradient(90deg, #F7EFEA 0%, rgba(247,239,234,0) 7%, rgba(247,239,234,0) 93%, #F7EFEA 100%); }
</style></head><body>
<div class="header"><img src="date-photo.jpg" alt=""><div class="fade"></div></div>
</body></html>
