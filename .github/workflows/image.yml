# Builds the production image on every push to main and pushes it to GHCR.
# Dokploy pulls the image; nothing is built on the server.
# Pull requests into main and manual runs on other branches run the tests only:
# only main builds :latest and deploys.
# To freeze deploys (e.g. the wedding week), blank the DOKPLOY_DEPLOY_URL secret.

name: Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Each job asks for what it needs; nothing by default.
permissions: {}

# One run at a time per branch or pull request, so main's deploys stay in order.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nona
          POSTGRES_PASSWORD: nona
          POSTGRES_DB: nona
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nona"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nona_test
      POSTGRES_USER: nona
      POSTGRES_PASSWORD: nona
      # The MinIO started below, with MinIO's well-known default keys (not secrets).
      R2_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_PRIVATE_BUCKET: nona-private
      R2_PUBLIC_BUCKET: nona-public
      MEDIA_BASE_URL: http://localhost:9000/nona-public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # The service container can't run the init SQL, so create the test database here.
      - name: Create test database
        run: psql -h localhost -U nona -d nona -c "CREATE DATABASE nona_test"
        env:
          PGPASSWORD: nona

      # MinIO stands in for R2. A service container can't be given MinIO's `server /data`
      # command, so it starts here: the image pinned in docker-compose.yml, on a volume because
      # MinIO's renames fail on the container's own overlay layer.
      - name: Start MinIO
        run: |
          docker run --detach --name minio --publish 9000:9000 \
            --env MINIO_ROOT_USER="$R2_ACCESS_KEY_ID" --env MINIO_ROOT_PASSWORD="$R2_SECRET_ACCESS_KEY" \
            --volume minio-data:/data \
            cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82 \
            server /data
          for attempt in $(seq 1 30); do
            if curl -fs -o /dev/null http://localhost:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          echo "MinIO did not become ready in 30 s"
          docker logs minio
          exit 1

      - run: npm ci
      # Creates MinIO's two buckets and makes the public one readable by anyone.
      - run: npm run storage:init
      # Generates next-env.d.ts and route types, which a fresh checkout lacks.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # Builds the site and runs it against the test database; the config blanks the email key.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'https://nobletxnancy.com' }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tell Dokploy to deploy
        if: env.DOKPLOY_DEPLOY_URL != ''
        run: curl -fsS -X POST "$DOKPLOY_DEPLOY_URL"
