# Builds the production image on every push to main and pushes it to GHCR.
# Dokploy pulls the image; nothing is built on the server.
# To freeze deploys (e.g. the wedding week), blank the DOKPLOY_DEPLOY_URL secret.

name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nona
          POSTGRES_PASSWORD: nona
          POSTGRES_DB: nona
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nona"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nona_test
      POSTGRES_USER: nona
      POSTGRES_PASSWORD: nona
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # The service container can't run the init SQL, so create the test database here.
      - name: Create test database
        run: psql -h localhost -U nona -d nona -c "CREATE DATABASE nona_test"
        env:
          PGPASSWORD: nona

      - run: npm ci
      # Generates next-env.d.ts and route types, which a fresh checkout lacks.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # Builds the site and runs it against the test database; the config blanks the email key.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'https://nobletxnancy.com' }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tell Dokploy to deploy
        if: env.DOKPLOY_DEPLOY_URL != ''
        run: curl -fsS -X POST "$DOKPLOY_DEPLOY_URL"
