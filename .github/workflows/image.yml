# Builds the production image on every push to main and pushes it to GHCR.
# Dokploy pulls the image; nothing is built on the server.
# To freeze deploys (e.g. the wedding week), blank the DOKPLOY_DEPLOY_URL secret.

name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'https://nobletxnancy.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tell Dokploy to deploy
        if: env.DOKPLOY_DEPLOY_URL != ''
        run: curl -fsS -X POST "$DOKPLOY_DEPLOY_URL"
